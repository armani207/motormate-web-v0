<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Calculator</title>

  <!-- Include your global site styles -->
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      margin: 0;
      padding: 1rem;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: transparent;
    }

    .card {
      background-color: var(--white);
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      text-align: left;
      font-size: 1.125rem;
      line-height: 1.6;
      border: 1px solid var(--slate-300);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--brand);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .stat:last-child {
      margin-bottom: 0;
    }

    .stat b {
      color: var(--slate-900);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Population Stats</h2>
  <div class="stat">
    <span>World Population:</span>
    <b id="population">0</b>
  </div>
  <div class="stat">
    <span>Births Today:</span>
    <b id="births">0</b>
  </div>
  <div class="stat">
    <span>CP Births Today:</span>
    <b id="cp-births">0</b>
  </div>
</div>

<script>
  function animateCount(el, start, end, duration = 1000) {
    const range = end - start;
    if (range === 0) return;
    let startTime = null;

    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      const value = Math.floor(start + range * progress);
      el.textContent = value.toLocaleString();
      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || !data.population) return;

    const population = Number(data.population.toString().replace(/,/g, ""));
    const birthsToday = Number(data.birthsToday.toString().replace(/,/g, ""));
    const cpBirths = Math.round((birthsToday * 2) / 1000);

    // Animate each stat
    animateCount(document.getElementById("population"), Number(document.getElementById("population").textContent.replace(/,/g,'')), population);
    animateCount(document.getElementById("births"), Number(document.getElementById("births").textContent.replace(/,/g,'')), birthsToday);
    animateCount(document.getElementById("cp-births"), Number(document.getElementById("cp-births").textContent.replace(/,/g,'')), cpBirths);
  });
</script>

</body>
</html>
