<header class="site-header" [class.site-header-scrolled]="isScrolled">
  <div class="site-header-inner">
    <a routerLink="/" class="brand-mark" aria-label="MotorMate Health home" (click)="closeMobileNav()">
      <img
        src="/motormate-logo.png"
        alt=""
        class="brand-logo"
        width="44"
        height="44"
        decoding="async"
        fetchpriority="high"
      />
      <span class="brand-text">
        <strong>MotorMate</strong>
        <small>Health LLC</small>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="isMobileNavOpen"
      (click)="toggleMobileNav()"
      [attr.aria-expanded]="isMobileNavOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="isMobileNavOpen ? 'Close menu' : 'Open menu'"
    >
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
    </button>
  </div>

  <nav
    id="primary-navigation"
    class="overlay-nav"
    [class.is-open]="isMobileNavOpen"
    aria-label="Primary navigation"
    [attr.aria-hidden]="!isMobileNavOpen"
  >
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileNav()">Home</a>
    <a routerLink="/motormate" routerLinkActive="active" (click)="closeMobileNav()">Device</a>
    <a routerLink="/cp-catalog" routerLinkActive="active" (click)="closeMobileNav()">Network</a>
    <a routerLink="/map" routerLinkActive="active" (click)="closeMobileNav()">Map</a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMobileNav()">Company</a>
    <a routerLink="/partner" routerLinkActive="active" (click)="closeMobileNav()">Partner</a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/account" class="nav-cta" routerLinkActive="active" (click)="closeMobileNav()">Account</a>
      <button type="button" class="nav-signout" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/login" class="nav-cta" routerLinkActive="active" (click)="closeMobileNav()">Sign in</a>
    }
  </nav>
</header>
